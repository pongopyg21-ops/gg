<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cucina">
<!-- La pentola sul fuoco, col vapore che sale: e' l'icona della Cucina.
     Disegno piatto su fondo **trasparente**, come le emoji delle altre schede
     (Appunti, FAQ, TV, GYM, Igiene): un simbolo, non una tessera. Prima aveva
     un riquadro di fondo colorato, e in mezzo alle emoji sembrava il logo
     dell'app incollato sulla scheda: quella era l'incoerenza. Senza fondo,
     l'icona si posa come le altre. -->
<!-- il vapore: tre fili che salgono dal coperchio, in azzurro tenue -->
<g transform="translate(0,3)">
<g fill="none" stroke="#8fb4c4" stroke-width="2.6" stroke-linecap="round">
  <path d="M24 17c-2.5-3 2.5-5 0-8"/>
  <path d="M32 15c-2.5-3 2.5-5 0-8"/>
  <path d="M40 17c-2.5-3 2.5-5 0-8"/>
</g>
<!-- i manici -->
<rect x="9" y="31" width="8" height="5" rx="2.5" fill="#8f2f08"/>
<rect x="47" y="31" width="8" height="5" rx="2.5" fill="#8f2f08"/>
<!-- la pentola: si restringe verso il fondo, come una pentola vera -->
<path d="M16 29h32l-2.6 20a4.5 4.5 0 0 1-4.4 4H23a4.5 4.5 0 0 1-4.4-4z" fill="#c1440e"/>
<!-- il bordo, piu' scuro, chiude la pentola in alto -->
<rect x="14" y="26" width="36" height="6" rx="3" fill="#8f2f08"/>
</g>
</svg>
