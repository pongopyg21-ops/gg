<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cucina">
<!-- Il cappello da chef (la toque), col suo bordo: e' l'icona della Cucina.
     Disegno piatto su fondo **trasparente**, come le emoji delle altre schede
     (Appunti, FAQ, TV, GYM, Igiene): un simbolo, non una tessera. La corona e'
     chiara, il bordo e' ambra: il bordo da' il contorno che serve perche' il
     cappello si veda anche sul fondo chiaro, senza bisogno di un riquadro. -->
<!-- la corona: tre bozze che, dello stesso colore e senza contorno, si fondono
     in un'unica sagoma morbida -->
<g fill="#f2ecdc">
  <circle cx="20" cy="27" r="10"/>
  <circle cx="32" cy="22" r="12"/>
  <circle cx="44" cy="27" r="10"/>
  <rect x="18" y="30" width="28" height="13" rx="3"/>
</g>
<!-- il bordo, raccolto: e' la fascia della toque -->
<rect x="16" y="40" width="32" height="12" rx="4" fill="#d9b877"/>
<rect x="16" y="40" width="32" height="4" rx="2" fill="#c99f52"/>
</svg>
